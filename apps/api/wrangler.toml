name = "google-flow-auto-api"
main = "src/index.ts"
compatibility_date = "2026-11-14"

# The API authenticates the owner with a password (signed HttpOnly session cookie) and the browser
# worker with a bearer token (see src/auth.ts). Serving it only on the PWA hostname keeps the cookie
# first-party and avoids CORS, so the workers.dev and preview hostnames are disabled.
workers_dev = false
preview_urls = false

# Serve the API on the SAME hostname as the PWA (same-origin, no CORS needed).
# Uncomment and set your zone/hostname:
# routes = [{ pattern = "app.example.com/api/*", zone_name = "example.com" }]

# Stale-lease recovery runs every minute even when no worker is polling, so a crashed worker's
# job is requeued (or failed after the retry limit) without waiting for the next claim.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "google-flow-auto"
database_id = "660dfd32-956e-4919-9da5-526954f0665c"
# Versioned migrations (Phase 2): `npx wrangler d1 migrations apply google-flow-auto --remote`
migrations_dir = "../../cloudflare/migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "google-flow-auto-media"

# Per-identity rate limits (Workers Rate Limiting; approximate, per Cloudflare location).
# namespace_id must be unique within your Cloudflare account.
[[ratelimits]]
name = "RL_READ"
namespace_id = "7101"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "7102"

  [ratelimits.simple]
  limit = 20
  period = 60

# Password logins: keyed by client address and checked BEFORE any password comparison.
[[ratelimits]]
name = "RL_LOGIN"
namespace_id = "7104"

  [ratelimits.simple]
  limit = 10
  period = 60

# Worker (bearer token) endpoints poll and heartbeat, so they get their own, larger bucket.
[[ratelimits]]
name = "RL_WORKER"
namespace_id = "7103"

  [ratelimits.simple]
  limit = 120
  period = 60

[vars]
APP_ENV = "production"
# Live (non dry-run) engines stay disabled until Phase 5 qualifies an adapter.
# This is also the live kill switch: while "false" the queue only hands out dry-run jobs.
LIVE_ENGINES_ENABLED = "false"

# Secrets (never put these in this file or in git; each is set once with `wrangler secret put`):
#   npx wrangler secret put OWNER_PASSWORD   owner login password, at least 10 characters (use a long random one)
#   npx wrangler secret put SESSION_SECRET   random key that signs session cookies, at least 32 characters;
#                                            generate with `openssl rand -base64 48`; changing it logs everyone out
#   npx wrangler secret put WORKER_TOKEN     bearer token of the browser worker, at least 32 characters
#                                            (letters, digits and . _ ~ + / = - only); unset = worker API disabled
# Optional: ALLOWED_ORIGINS (extra exact origins for CORS and writes) can also be set as a secret.
# Until OWNER_PASSWORD and SESSION_SECRET are set the API fails closed (503) on every /api/* call.
