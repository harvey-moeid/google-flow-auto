name = "google-flow-auto-api"
main = "src/index.ts"
compatibility_date = "2026-11-14"

# The API must only be reachable through the Cloudflare Access protected hostname.
# workers.dev / preview URLs would bypass Access, so they are disabled. The Worker also
# verifies the Access JWT itself, so a misrouted request is still rejected.
workers_dev = false
preview_urls = false

# Serve the API on the SAME hostname as the PWA (same-origin, no CORS needed).
# Uncomment and set your zone/hostname after creating the Access application:
# routes = [{ pattern = "app.example.com/api/*", zone_name = "example.com" }]

# Stale-lease recovery runs every minute even when no worker is polling, so a crashed worker's
# job is requeued (or failed after the retry limit) without waiting for the next claim.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "google-flow-auto"
database_id = "660dfd32-956e-4919-9da5-526954f0665c"
# Versioned migrations (Phase 2): `npx wrangler d1 migrations apply google-flow-auto --remote`
migrations_dir = "../../cloudflare/migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "google-flow-auto-media"

# Per-identity rate limits (Workers Rate Limiting; approximate, per Cloudflare location).
# namespace_id must be unique within your Cloudflare account.
[[ratelimits]]
name = "RL_READ"
namespace_id = "7101"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "7102"

  [ratelimits.simple]
  limit = 20
  period = 60

# Worker (service token) endpoints poll and heartbeat, so they get their own, larger bucket.
[[ratelimits]]
name = "RL_WORKER"
namespace_id = "7103"

  [ratelimits.simple]
  limit = 120
  period = 60

[vars]
APP_ENV = "production"
# From Zero Trust > Settings > Custom pages / team domain, e.g. myteam.cloudflareaccess.com
CF_ACCESS_TEAM_DOMAIN = "REPLACE_WITH_TEAM.cloudflareaccess.com"
# Application Audience (AUD) tag of the Access application (64 hex characters).
CF_ACCESS_AUD = "REPLACE_WITH_ACCESS_APPLICATION_AUD_TAG"
# Live (non dry-run) engines stay disabled until Phase 5 qualifies an adapter.
# This is also the live kill switch: while "false" the queue only hands out dry-run jobs.
LIVE_ENGINES_ENABLED = "false"
# Set ALLOWED_EMAILS as a secret so owner emails never enter git:
#   npx wrangler secret put ALLOWED_EMAILS      (comma separated, e.g. owner@example.com)
# Worker endpoints (/api/worker/*) accept ONLY Access service tokens. List the allowed service token
# Client IDs (the "common_name" claim, e.g. abc123.access) as a secret; empty/unset = worker API disabled:
#   npx wrangler secret put ALLOWED_SERVICE_TOKENS
# Optional ALLOWED_ORIGINS (extra exact origins) can also be set with `wrangler secret put`.
