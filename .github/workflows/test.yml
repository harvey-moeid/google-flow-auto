name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pwa-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck API
        run: npm run typecheck:api
      - name: Test API (auth, CORS, validation, rate limit, audit)
        run: npm run test:api
      - name: Test repository scripts
        run: npm run test:scripts
      - name: Build PWA
        run: npm run build:pwa
      - name: Scan built PWA assets and frontend wiring for secrets
        run: npm run check:secrets
  python-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q .
      - run: python -m pytest
      - name: Dry-run smoke test (no Google login, no browser profile)
        env:
          FLOW_WORKER_DATA_DIR: ${{ runner.temp }}/worker-data
          FLOW_HEADLESS: "true"
        run: |
          python -m worker.main --engine dry-run --job-id ci-smoke | tee "$RUNNER_TEMP/smoke.txt"
          grep -q "'mode': 'dry-run'" "$RUNNER_TEMP/smoke.txt"
