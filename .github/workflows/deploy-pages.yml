name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/pwa/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build PWA
        run: npm run build:pwa

      - name: Scan built frontend for secrets
        run: npm run check:secrets

      - name: Ensure Cloudflare Pages project exists
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          projects="$(npx wrangler pages project list)"
          if ! grep -Fq "google-flow-auto" <<< "$projects"; then
            npx wrangler pages project create google-flow-auto --production-branch main
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy production site to Cloudflare Pages
        working-directory: apps/api
        run: npx wrangler pages deploy ../pwa/dist --project-name=google-flow-auto --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
